<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background -->
  <rect width="64" height="64" rx="12" fill="#1e1b18"/>

  <!-- Gallows: Base -->
  <rect x="8" y="56" width="30" height="4" rx="2" fill="#dda15e"/>
  <!-- Gallows: Pole -->
  <rect x="16" y="12" width="4" height="44" rx="2" fill="#dda15e"/>
  <!-- Gallows: Top bar -->
  <rect x="16" y="12" width="22" height="4" rx="2" fill="#dda15e"/>
  <!-- Gallows: Rope -->
  <rect x="35" y="16" width="2.5" height="8" rx="1" fill="#f5deb3"/>

  <!-- Hangman figure -->
  <!-- Head (circle outline) -->
  <circle cx="36" cy="29" r="5" fill="none" stroke="#f5deb3" stroke-width="2.2"/>
  <!-- Body -->
  <line x1="36" y1="34" x2="36" y2="45" stroke="#f5deb3" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Left arm -->
  <line x1="36" y1="37" x2="30" y2="42" stroke="#f5deb3" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Right arm -->
  <line x1="36" y1="37" x2="42" y2="42" stroke="#f5deb3" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Left leg -->
  <line x1="36" y1="45" x2="30" y2="52" stroke="#f5deb3" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Right leg -->
  <line x1="36" y1="45" x2="42" y2="52" stroke="#f5deb3" stroke-width="2.2" stroke-linecap="round"/>

  <!-- AI spark: top-right corner glow -->
  <circle cx="54" cy="10" r="6" fill="#3b82f6" opacity="0.25"/>
  <text x="51" y="14" font-size="9" font-family="Arial" font-weight="bold" fill="#60a5fa">AI</text>
</svg>
